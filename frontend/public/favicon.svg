<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.25" flood-color="#1E3A8A" />
    </filter>
  </defs>

  <!-- Fond Squircle avec dégradé premium -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brandGradient)" />

  <!-- Bordure interne subtile -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" stroke="#93C5FD" stroke-width="1" stroke-opacity="0.4" />

  <!-- Éléments Kanban / Gestion de Projet -->
  <g filter="url(#shadow)">
    <!-- Colonne 1 : À faire -->
    <rect x="13" y="15" width="10" height="34" rx="3" fill="url(#cardGradient)" fill-opacity="0.95" />
    <rect x="15" y="18" width="6" height="12" rx="1.5" fill="#3B82F6" />
    <rect x="15" y="33" width="6" height="8" rx="1.5" fill="#93C5FD" />

    <!-- Colonne 2 : En cours (plus haute / active) -->
    <rect x="27" y="15" width="10" height="34" rx="3" fill="url(#cardGradient)" fill-opacity="0.95" />
    <rect x="29" y="18" width="6" height="18" rx="1.5" fill="#2563EB" />
    <rect x="29" y="39" width="6" height="6" rx="1.5" fill="#60A5FA" />

    <!-- Colonne 3 : Terminé -->
    <rect x="41" y="15" width="10" height="34" rx="3" fill="url(#cardGradient)" fill-opacity="0.95" />
    <rect x="43" y="18" width="6" height="8" rx="1.5" fill="#10B981" />
    <rect x="43" y="29" width="6" height="14" rx="1.5" fill="#34D399" />
  </g>

  <!-- Indicateur de succès / point d'accentuation -->
  <circle cx="48" cy="12" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="2" />
</svg>
